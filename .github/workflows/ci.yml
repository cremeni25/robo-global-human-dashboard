name: Robô Global CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rg
          POSTGRES_PASSWORD: rg
          POSTGRES_DB: rg_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes (SQLite)
        run: pytest -q
      - name: Testes (PostgreSQL, igual ao Supabase)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rg:rg@localhost:5432/rg_test
      - name: Esquema SQL atualizado
        run: python scripts/gerar_schema_sql.py && git diff --exit-code sql/001_schema.sql
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
