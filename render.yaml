# Robô Global — configuração alvo dos 2 serviços que FICAM no Render.
# A migração reaproveita os serviços existentes (mesmos domínios):
#   robo-global-api-v2   (api.roboglobal.com.br)  → esta API (pasta api/)
#   robo-global-frontend (www.roboglobal.com.br)  → este site (pasta web/)
# Passo a passo em docs/OPERACAO.md. Variáveis marcadas "copiar do core-v1" já existem lá.
services:
  - type: web
    name: robo-global-api-v2
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL          # copiar do core-v1 (Postgres do Supabase)
        sync: false
      - key: ADMIN_TOKENS          # nome:token (16+ caracteres), um por pessoa
        sync: false
      - key: HOTMART_HOTTOK        # copiar do core-v1
        sync: false
      - key: AWIN_PUBLISHER_ID     # copiar do core-v1
        sync: false
      - key: AWIN_API_TOKEN        # gerar novo em ui.awin.com > API credentials (o atual falha)
        sync: false
      - key: AWIN_FEED_URL         # copiar do core-v1
        sync: false
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: VISITOR_HASH_SALT
        generateValue: true
      - key: CORS_ORIGINS
        value: https://www.roboglobal.com.br,https://roboglobal.com.br,https://robo-global-frontend.onrender.com

  - type: web
    name: robo-global-frontend
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.roboglobal.com.br
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
